services:
    app:
        build:
            context: .
            target: app
        container_name: benchmark-cosma
        restart: unless-stopped
        ports:
            - "9039:443"
        env_file: .env
        environment:
            DB_HOST: host.docker.internal
            REDIS_HOST: redis
            RUN_MIGRATIONS: "false"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - storage:/var/www/html/storage
            - /etc/letsencrypt:/etc/letsencrypt:ro
        depends_on:
            - redis
        networks:
            - cosma

    redis:
        image: redis:7-alpine
        container_name: benchmark-cosma-redis
        restart: unless-stopped
        volumes:
            - redisdata:/data
        networks:
            - cosma

volumes:
    storage:
    redisdata:

networks:
    cosma:
        ipam:
            config:
                - subnet: 172.28.0.0/16
                  gateway: 172.28.0.1
